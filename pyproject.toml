[tool.poetry]
name = "echo-client"
version = "0.0.12"
description = ""
authors = ["Clarke X <xrh0905@xrh0905.top>", "Rickyxrc <rickyxrc@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4"
aiohttp = "^3.11.0"
rich = "^14.0.0"
pypinyin = "^0.55.0"
pyyaml = "^6.0.1"
jieba = "^0.42.1"
"markdown-it-py" = "^3.0.0"

[tool.poetry.scripts]
echo-client = 'echo_client.cli:main'

[tool.poetry.group.dev.dependencies]
pylint = "^3.3.0"
pre-commit = "^4.0.0"
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
